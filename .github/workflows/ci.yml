name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # 백엔드 테스트가 실제 MySQL 을 쓴다. 로컬 docker-compose.yml 과 같은 버전/문자셋
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: whenwemeet
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # CI 전용 값. 운영 비밀값이 아니다
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/whenwemeet
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/whenwemeet_test
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_EXPIRES_IN: 30d
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      KAKAO_CLIENT_ID: ci
      KAKAO_CLIENT_SECRET: ci
      KAKAO_ADMIN_KEY: ci
      KAKAO_REDIRECT_URI: http://localhost:4000/v1/auth/kakao/callback

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 서비스 컨테이너는 DB 를 하나만 만들므로 테스트 DB 는 여기서 생성 (문자셋은 서버 기본값과 동일하게 명시)
      - name: 테스트 DB 생성
        run: >-
          mysql -h 127.0.0.1 -uroot -proot
          -e "CREATE DATABASE IF NOT EXISTS whenwemeet_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      # 백엔드가 스키마를 넣기 전에는 건너뛴다. 스키마가 있으면 generate 실패가 CI 실패가 되도록 || true 를 쓰지 않음
      - name: Prisma Client 생성
        run: |
          if [ -f apps/api/prisma/schema.prisma ]; then
            pnpm --filter @whenwemeet/api exec prisma generate
          else
            echo "apps/api/prisma/schema.prisma 없음 — prisma generate 건너뜀"
          fi

      - run: pnpm -r --filter ./apps/* --if-present lint
      - run: pnpm -r --filter ./apps/* --if-present test
      - run: pnpm -r --filter ./apps/* --if-present build
