name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter ./apps/* --if-present lint
      - run: pnpm -r --filter ./apps/* --if-present test
      - run: pnpm -r --filter ./apps/* --if-present build
        env:
          # 빌드만 통과하면 되는 더미 값
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          JWT_SECRET: ci-only-secret-not-for-production
