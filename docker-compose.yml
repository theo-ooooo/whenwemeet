# 언제볼까 로컬 개발용 MySQL (이슈 #3)
# - 값은 루트 .env 에서 읽는다 (`cp .env.example .env`). apps/api/.env 의 DATABASE_URL 과 항상 일치시킬 것
# - 호스트 포트 기본 3307: 로컬에 이미 떠 있는 MySQL(3306) 과 충돌 회피
# - 첫 기동 시 docker/mysql/init/ 의 스크립트가 한 번 실행되어 테스트 DB(whenwemeet_test) 를 만든다
services:
  mysql:
    image: mysql:8.4
    container_name: whenwemeet-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whenwemeet}
      MYSQL_USER: ${MYSQL_USER:-wwm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wwmpw}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql-data:
